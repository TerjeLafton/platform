syntax = "proto3";

package todo.v1;

option go_package = "platform/libs/proto-stubs/todo/v1;todov1";

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// Messages

message List {
  string id = 1;
  string user_id = 2;
  string title = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  int32 total_items = 6;
  int32 completed_items = 7;
  string owner_name = 8;
  bool is_owner = 9;
}

message Item {
  string id = 1;
  string list_id = 2;
  string title = 3;
  bool completed = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// List Operations

message CreateListRequest {
  string user_id = 1;
  string title = 2;
}

message CreateListResponse {
  List list = 1;
}

message GetListsByUserRequest {
  string user_id = 1;
}

message GetListsByUserResponse {
  repeated List lists = 1;
}

message UpdateListTitleRequest {
  string id = 1;
  string user_id = 2;
  string title = 3;
}

message UpdateListTitleResponse {
  List list = 1;
}

message DeleteListRequest {
  string id = 1;
  string user_id = 2;
}

message DeleteListResponse {}

// Item Operations

message CreateItemRequest {
  string list_id = 1;
  string title = 2;
  string user_id = 3;
}

message CreateItemResponse {
  Item item = 1;
}

message GetAllItemsFromListRequest {
  string list_id = 1;
  string user_id = 2;
}

message GetAllItemsFromListResponse {
  repeated Item items = 1;
}

message ToggleItemCompletedRequest {
  string id = 1;
  string user_id = 2;
}

message ToggleItemCompletedResponse {
  Item item = 1;
}

message DeleteItemRequest {
  string id = 1;
  string user_id = 2;
  string list_id = 3;
}

message DeleteItemResponse {}

// Events (for pub/sub)

message ListCreatedEvent {
  List list = 1;
  google.protobuf.Timestamp occurred_at = 2;
}

message ItemCompletedEvent {
  Item item = 1;
  google.protobuf.Timestamp occurred_at = 2;
}

message ItemDeletedEvent {
  string list_id = 1;
  string item_id = 2;
}

// Sharing Operations

message ListMember {
  string user_id = 1;
  string email = 2;
  string name = 3;
  google.protobuf.Timestamp added_at = 4;
}

message AddListMemberRequest {
  string list_id = 1;
  string user_id = 2;
  string member_email = 3;
}

message AddListMemberResponse {
  ListMember member = 1;
}

message RemoveListMemberRequest {
  string list_id = 1;
  string user_id = 2;
  string member_user_id = 3;
}

message RemoveListMemberResponse {}

message GetListMembersRequest {
  string list_id = 1;
  string user_id = 2;
}

message GetListMembersResponse {
  repeated ListMember members = 1;
}
