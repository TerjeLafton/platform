syntax = "proto3";

package todo.v1;

option go_package = "platform/libs/proto-stubs/todo/v1;todov1";

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// Messages

message List {
  string id = 1;
  string user_id = 2;
  string title = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message Item {
  string id = 1;
  string list_id = 2;
  string title = 3;
  bool completed = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// List Operations

message CreateListRequest {
  string user_id = 1;
  string title = 2;
}

message CreateListResponse {
  List list = 1;
}

message GetListsByUserRequest {
  string user_id = 1;
}

message GetListsByUserResponse {
  repeated List lists = 1;
}

message UpdateListTitleRequest {
  string id = 1;
  string user_id = 2;
  string title = 3;
}

message UpdateListTitleResponse {
  List list = 1;
}

message DeleteListRequest {
  string id = 1;
  string user_id = 2;
}

message DeleteListResponse {}

// Item Operations

message CreateItemRequest {
  string list_id = 1;
  string title = 2;
  string user_id = 3;
}

message CreateItemResponse {
  Item item = 1;
}

message GetAllItemsFromListRequest {
  string list_id = 1;
  string user_id = 2;
}

message GetAllItemsFromListResponse {
  repeated Item items = 1;
}

message ToggleItemCompletedRequest {
  string id = 1;
  string user_id = 2;
}

message ToggleItemCompletedResponse {
  Item item = 1;
}

message DeleteItemRequest {
  string id = 1;
  string user_id = 2;
}

message DeleteItemResponse {}

// Events (for pub/sub)

message ListCreatedEvent {
  List list = 1;
  google.protobuf.Timestamp occurred_at = 2;
}

message ItemCompletedEvent {
  Item item = 1;
  google.protobuf.Timestamp occurred_at = 2;
}
